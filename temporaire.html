<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance — Mon Esprit</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #14171A;
    color: #E8E6E1;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }
  .box { max-width: 480px; }
  .icon { font-size: 3rem; margin-bottom: 1.5rem; }
  h1 {
    font-family: Georgia, serif;
    font-size: 1.8rem;
    margin-bottom: 1rem;
  }
  p {
    color: #9CA3AF;
    line-height: 1.6;
    margin-bottom: 0.75rem;
  }
  .accent { color: #E08A4B; font-weight: 600; }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">🧠</div>
    <h1>Mon Esprit fait une petite pause</h1>
    <p>On est en train d'améliorer le site en coulisses. Ça ne prendra pas longtemps.</p>
    <p>Reviens dans <span class="accent">quelques instants</span> — l'encyclopédie sera de retour très vite.</p>
  </div>
</body>
</html>
